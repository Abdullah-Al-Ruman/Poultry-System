<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poultry Coop Environment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Poultry Coop Environment</h1>
      <span id="status-badge" class="badge offline">OFFLINE</span>
    </header>

    <div class="grid">
      <!-- Temperature Card -->
      <div class="card">
        <div class="icon">🌡️</div>
        <h3>Temperature</h3>
        <div class="value" id="val-temp">--</div>
        <div class="unit">°C</div>
      </div>

      <!-- Humidity Card -->
      <div class="card">
        <div class="icon">💧</div>
        <h3>Humidity</h3>
        <div class="value" id="val-hum">--</div>
        <div class="unit">%</div>
      </div>

      <!-- Gas Level Card -->
      <div class="card">
        <div class="icon">☣️</div>
        <h3>Gas Level</h3>
        <div class="value" id="val-gas">--</div>
        <div class="unit">PPM</div>
      </div>

      <!-- Feed Distance Card -->
      <div class="card">
        <div class="icon">🌾</div>
        <h3>Feed Distance</h3>
        <div class="value" id="val-feed">--</div>
        <div class="unit">cm</div>
      </div>

      <!-- Water Distance Card -->
      <div class="card">
        <div class="icon">🚰</div>
        <h3>Water Distance</h3>
        <div class="value" id="val-water">--</div>
        <div class="unit">cm</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
