<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poultry Coop Monitor</title>
    <link rel="icon" type="image/png" href="favicon.png?v=3">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Poultry Coop Environment</h1>
            <div id="status-badge" class="badge connecting">Connecting...</div>
        </header>

        <main class="grid">
            <div class="card">
                <div class="icon">🌡️</div>
                <h3>Temperature</h3>
                <div class="value" id="val-temp">--</div>
                <div class="unit">°C</div>
            </div>

            <div class="card">
                <div class="icon">💧</div>
                <h3>Humidity</h3>
                <div class="value" id="val-hum">--</div>
                <div class="unit">%</div>
            </div>

            <div class="card">
                <div class="icon">☣️</div>
                <h3>Gas Level (MQ135)</h3>
                <div class="value" id="val-gas">--</div>
                <div class="unit">PPM</div>
            </div>

            <div class="card">
                <div class="icon">🌾</div>
                <h3>Feed Distance</h3>
                <div class="value" id="val-feed">--</div>
                <div class="unit">cm</div>
            </div>

            <div class="card">
                <div class="icon">🚰</div>
                <h3>Water Distance</h3>
                <div class="value" id="val-water">--</div>
                <div class="unit">cm</div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
